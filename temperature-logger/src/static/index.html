<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>現在の温湿度 | 温湿度モニター</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="/static/monitor.js" defer></script>
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="/">温湿度モニター</a>
        <nav class="nav" aria-label="ページ">
          <a href="/" aria-current="page">現在の温湿度</a>
          <a href="/stats">統計・履歴</a>
        </nav>
      </header>

      <section class="monitor-heading" aria-label="測定状態">
        <p class="eyebrow">LIVE MONITOR</p>
        <h1>現在の温湿度</h1>
        <p class="muted">室内の空気を，いつでも見やすく．</p>
        <div class="current-status" id="currentStatus" data-state="unknown" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusLabel">測定値を確認しています</span>
          <span class="measured-at" id="measuredAt">最終測定：—</span>
        </div>
      </section>

      <section class="current-values" aria-label="現在値">
        <div class="metric-temperature">
          <span class="metric-label">気温</span>
          <span class="metric-value"><span id="temperatureValue">—</span><small>℃</small></span>
        </div>
        <div class="metric-humidity">
          <span class="metric-label">湿度</span>
          <span class="metric-value"><span id="humidityValue">—</span><small>%</small></span>
        </div>
      </section>

      <p class="notice" id="notice" role="alert" hidden></p>
      <details class="error-details" id="errorDetails" hidden>
        <summary>センサー・Ambient のエラー</summary>
        <p id="errorValue"></p>
      </details>

      <section aria-labelledby="historyTitle">
        <div class="section-heading">
          <h2 id="historyTitle">温湿度の推移</h2>
          <p>時刻は日本標準時（JST）</p>
        </div>
        <div class="button-group range-controls" role="group" aria-label="表示期間">
          <button type="button" data-range="1h">1時間</button>
          <button type="button" data-range="6h">6時間</button>
          <button type="button" data-range="24h">24時間</button>
          <button type="button" data-range="7d">7日間</button>
        </div>
        <div class="chart-section temperature">
          <h3>気温 <span class="muted">℃</span></h3>
          <div class="chart-area"><canvas id="temperatureChart" role="img" aria-label="気温の時間別推移"></canvas></div>
        </div>
        <div class="chart-section humidity">
          <h3>湿度 <span class="muted">%</span></h3>
          <div class="chart-area"><canvas id="humidityChart" role="img" aria-label="湿度の時間別推移"></canvas></div>
        </div>
        <p class="chart-message" id="chartMessage" role="status" hidden></p>
      </section>
      <noscript><p>グラフを表示するには JavaScript を有効にしてください．</p></noscript>
    </main>
  </body>
</html>
