<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>統計・履歴 | 温湿度モニター</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --temperature: #c2410c;
        --humidity: #2563eb;
      }

      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.7;
        color: #222;
        background: linear-gradient(160deg, #f5f5f5, #fafafa);
        min-height: 100vh;
      }

      main {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #ddd;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #eee;
      }

      .nav a {
        color: #555;
        text-decoration: none;
      }

      .nav a[aria-current="page"] {
        color: #222;
        font-weight: 700;
        border-bottom: 2px solid currentColor;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 26px;
      }

      h2 {
        margin: 26px 0 12px;
        font-size: 20px;
      }

      .controls, .period-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }

      .controls {
        margin-bottom: 16px;
      }

      .control-set {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .control-label {
        color: #666;
        font-size: 14px;
      }

      .button-group {
        display: inline-flex;
        gap: 4px;
      }

      button {
        padding: 5px 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        color: #333;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        border-color: #555;
        background: #eee;
      }

      button:disabled {
        color: #aaa;
        cursor: default;
      }

      .period-controls {
        justify-content: space-between;
      }

      #rangeLabel {
        font-weight: 600;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 20px 0;
        padding: 16px 0;
        border-top: 1px solid #eee;
        border-bottom: 1px solid #eee;
      }

      .summary .label {
        color: #666;
        font-size: 14px;
      }

      .summary .number {
        font-size: 24px;
        font-weight: 700;
        color: var(--metric-color);
      }

      .chart-area {
        height: 340px;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 12px;
      }

      .message {
        color: #666;
        padding: 16px 0;
      }

      .error {
        color: #9b1c1c;
      }

      .table-scroll {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 560px;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th, td {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        text-align: right;
        white-space: nowrap;
      }

      th:first-child, td:first-child {
        text-align: left;
      }

      th {
        color: #555;
      }

      .ongoing {
        margin-left: 6px;
        color: #666;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        body { margin: 16px auto; }
        main { padding: 16px; }
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .summary .number { font-size: 21px; }
        .chart-area { height: 300px; }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <nav class="nav" aria-label="ページ">
        <a href="/">現在の温湿度</a>
        <a href="/stats" aria-current="page">統計・履歴</a>
      </nav>
      <h1>統計・履歴</h1>
      <div class="controls">
        <div class="control-set">
          <span class="control-label">集計単位</span>
          <div class="button-group" aria-label="集計単位">
            <button type="button" data-group="day">日別</button>
            <button type="button" data-group="week">週別</button>
            <button type="button" data-group="month">月別</button>
          </div>
        </div>
        <div class="control-set">
          <span class="control-label">指標</span>
          <div class="button-group" aria-label="指標">
            <button type="button" data-metric="temperature">気温</button>
            <button type="button" data-metric="humidity">湿度</button>
          </div>
        </div>
      </div>
      <div class="period-controls">
        <span id="rangeLabel"></span>
        <div class="button-group">
          <button type="button" id="previous">前の期間</button>
          <button type="button" id="next">次の期間</button>
        </div>
      </div>
      <div class="summary" aria-label="表示期間の統計">
        <div><div class="label">平均</div><div class="number" id="average">—</div></div>
        <div><div class="label">最高</div><div class="number" id="maximum">—</div></div>
        <div><div class="label">最低</div><div class="number" id="minimum">—</div></div>
        <div><div class="label">測定件数</div><div class="number" id="count">0</div></div>
      </div>
      <h2 id="chartTitle">気温の推移</h2>
      <div class="chart-area" id="chartArea">
        <canvas id="statsChart" role="img" aria-label="平均・最高・最低の推移"></canvas>
      </div>
      <p class="message" id="message" role="status" hidden></p>
      <h2>集計結果</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th scope="col">期間</th><th scope="col">平均</th><th scope="col">最高</th><th scope="col">最低</th><th scope="col">測定件数</th></tr></thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </main>
    <script>
      const groupSizes = { day: 30, week: 26, month: 12 };
      const metricNames = { temperature: "気温", humidity: "湿度" };
      const jstOffsetMs = 9 * 60 * 60 * 1000;
      let state;
      let chart = null;
      let requestNumber = 0;

      function isoDate(date) {
        return date.toISOString().slice(0, 10);
      }

      function jstDate(ms) {
        const local = new Date(ms + jstOffsetMs);
        return new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()));
      }

      function periodStart(date, group) {
        const result = new Date(date.getTime());
        if (group === "week") {
          result.setUTCDate(result.getUTCDate() - (result.getUTCDay() + 6) % 7);
        } else if (group === "month") {
          result.setUTCDate(1);
        }
        return result;
      }

      function move(date, group, amount) {
        const result = new Date(date.getTime());
        if (group === "month") {
          result.setUTCMonth(result.getUTCMonth() + amount);
        } else {
          result.setUTCDate(result.getUTCDate() + amount * (group === "week" ? 7 : 1));
        }
        return result;
      }

      function currentWindowStart(group) {
        return move(periodStart(jstDate(Date.now()), group), group, 1 - groupSizes[group]);
      }

      function parseDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
        const date = new Date(`${value}T00:00:00Z`);
        return !Number.isNaN(date.getTime()) && isoDate(date) === value ? date : null;
      }

      function readState() {
        const params = new URLSearchParams(location.search);
        const group = Object.hasOwn(groupSizes, params.get("group_by")) ? params.get("group_by") : "day";
        const metric = Object.hasOwn(metricNames, params.get("metric")) ? params.get("metric") : "temperature";
        const start = parseDate(params.get("start"));
        const first = start ? periodStart(start, group) : currentWindowStart(group);
        const current = currentWindowStart(group);
        return {
          group,
          metric,
          start: first < new Date(Date.UTC(1970, 0, 2)) || first > current ? current : first,
        };
      }

      function urlFor(value) {
        const params = new URLSearchParams({ group_by: value.group, metric: value.metric, start: isoDate(value.start) });
        return `/stats?${params.toString()}`;
      }

      function label(date, group) {
        const short = (value) => `${value.getUTCFullYear()}/${value.getUTCMonth() + 1}/${value.getUTCDate()}`;
        if (group === "day") return short(date);
        if (group === "week") return `${short(date)}〜${short(move(date, "day", 6))}`;
        return `${date.getUTCFullYear()}年${date.getUTCMonth() + 1}月`;
      }

      function bucketDate(ms) {
        return jstDate(ms);
      }

      function updateControls() {
        document.querySelectorAll("[data-group]").forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.group === state.group);
        });
        document.querySelectorAll("[data-metric]").forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.metric === state.metric);
        });
        const last = move(state.start, state.group, groupSizes[state.group] - 1);
        document.getElementById("rangeLabel").textContent = `${label(state.start, state.group)} 〜 ${label(last, state.group)}（JST）`;
        document.getElementById("next").disabled = state.start >= currentWindowStart(state.group);
        document.getElementById("page").style.setProperty("--metric-color", state.metric === "temperature" ? "var(--temperature)" : "var(--humidity)");
        document.getElementById("chartTitle").textContent = `${metricNames[state.metric]}の推移`;
      }

      function setMessage(text, error = false) {
        const element = document.getElementById("message");
        element.textContent = text;
        element.classList.toggle("error", error);
        element.hidden = !text;
      }

      function formatValue(value, unit) {
        return value == null ? "—" : `${Number(value).toFixed(1)} ${unit}`;
      }

      function renderSummary(summary) {
        const metric = state.metric;
        const unit = metric === "temperature" ? "℃" : "%";
        document.getElementById("average").textContent = formatValue(summary[`${metric}_avg`], unit);
        document.getElementById("maximum").textContent = formatValue(summary[`${metric}_max`], unit);
        document.getElementById("minimum").textContent = formatValue(summary[`${metric}_min`], unit);
        document.getElementById("count").textContent = summary.count.toLocaleString("ja-JP");
      }

      function renderTable(buckets) {
        const body = document.getElementById("results");
        body.replaceChildren();
        const now = Date.now();
        const unit = state.metric === "temperature" ? "℃" : "%";
        for (const bucket of [...buckets].reverse()) {
          const start = bucketDate(bucket.bucket_start_ms);
          const end = move(start, state.group, 1).getTime() - jstOffsetMs;
          const row = document.createElement("tr");
          const period = document.createElement("td");
          period.textContent = label(start, state.group);
          if (bucket.bucket_start_ms <= now && now < end) {
            const ongoing = document.createElement("span");
            ongoing.className = "ongoing";
            ongoing.textContent = "進行中";
            period.append(ongoing);
          }
          row.append(period);
          for (const suffix of ["avg", "max", "min"]) {
            const cell = document.createElement("td");
            cell.textContent = formatValue(bucket[`${state.metric}_${suffix}`], unit);
            row.append(cell);
          }
          const count = document.createElement("td");
          count.textContent = bucket.count.toLocaleString("ja-JP");
          row.append(count);
          body.append(row);
        }
      }

      function renderChart(buckets) {
        if (chart) {
          chart.destroy();
          chart = null;
        }
        const hasData = buckets.some((bucket) => bucket.count > 0);
        document.getElementById("chartArea").hidden = !hasData;
        if (!hasData) {
          setMessage("この期間には測定データがありません．");
          return;
        }
        if (typeof Chart === "undefined") {
          document.getElementById("chartArea").hidden = true;
          setMessage("グラフを表示できません．集計結果は表で確認できます．", true);
          return;
        }
        setMessage("");
        const metric = state.metric;
        const unit = metric === "temperature" ? "℃" : "%";
        const color = metric === "temperature" ? "#c2410c" : "#2563eb";
        const fill = metric === "temperature" ? "rgba(194, 65, 12, 0.12)" : "rgba(37, 99, 235, 0.12)";
        const labels = buckets.map((bucket) => label(bucketDate(bucket.bucket_start_ms), state.group));
        const values = (suffix) => buckets.map((bucket) => bucket[`${metric}_${suffix}`]);
        chart = new Chart(document.getElementById("statsChart"), {
          type: "line",
          data: {
            labels,
            datasets: [
              { label: "最高", data: values("max"), borderColor: color, borderWidth: 1, pointRadius: 0, spanGaps: false, fill: { target: 1, above: fill, below: fill } },
              { label: "最低", data: values("min"), borderColor: color, borderWidth: 1, pointRadius: 0, spanGaps: false },
              { label: "平均", data: values("avg"), borderColor: color, borderWidth: 3, pointRadius: 2, spanGaps: false },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (item) => `${item.dataset.label}: ${item.parsed.y.toFixed(1)} ${unit}`,
                  footer: (items) => `測定件数: ${buckets[items[0].dataIndex].count.toLocaleString("ja-JP")}`,
                },
              },
            },
            scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0 } }, y: { title: { display: true, text: `${metricNames[metric]} (${unit})` } } },
          },
        });
      }

      function clearResults() {
        if (chart) {
          chart.destroy();
          chart = null;
        }
        document.getElementById("chartArea").hidden = true;
        document.getElementById("results").replaceChildren();
        for (const id of ["average", "maximum", "minimum", "count"]) {
          document.getElementById(id).textContent = "—";
        }
      }

      async function load() {
        const request = ++requestNumber;
        updateControls();
        const end = move(state.start, state.group, groupSizes[state.group]);
        const params = new URLSearchParams({
          group_by: state.group,
          from: `${isoDate(state.start)}T00:00:00+09:00`,
          to: `${isoDate(end)}T00:00:00+09:00`,
        });
        try {
          const response = await fetch(`/api/stats?${params.toString()}`);
          if (!response.ok) throw new Error("集計データを取得できませんでした．");
          const data = await response.json();
          if (request !== requestNumber) return;
          renderSummary(data.summary);
          renderTable(data.buckets);
          renderChart(data.buckets);
        } catch (error) {
          if (request === requestNumber) {
            clearResults();
            setMessage(error.message, true);
          }
        }
      }

      function navigate(next) {
        state = next;
        history.pushState(null, "", urlFor(state));
        load();
      }

      document.querySelectorAll("[data-group]").forEach((button) => {
        button.addEventListener("click", () => {
          const group = button.dataset.group;
          if (group !== state.group) navigate({ group, metric: state.metric, start: currentWindowStart(group) });
        });
      });
      document.querySelectorAll("[data-metric]").forEach((button) => {
        button.addEventListener("click", () => {
          const metric = button.dataset.metric;
          if (metric !== state.metric) navigate({ ...state, metric });
        });
      });
      document.getElementById("previous").addEventListener("click", () => {
        navigate({ ...state, start: move(state.start, state.group, -groupSizes[state.group]) });
      });
      document.getElementById("next").addEventListener("click", () => {
        const start = move(state.start, state.group, groupSizes[state.group]);
        navigate({ ...state, start: start > currentWindowStart(state.group) ? currentWindowStart(state.group) : start });
      });
      window.addEventListener("popstate", () => {
        state = readState();
        load();
      });
      state = readState();
      history.replaceState(null, "", urlFor(state));
      load();
    </script>
  </body>
</html>
