name: Temperature frontend checks

on:
  pull_request:
    paths:
      - "temperature-logger/frontend/**"
      - "temperature-logger/src/static/**"
      - ".github/workflows/temperature-frontend.yml"
  push:
    branches:
      - main
    paths:
      - "temperature-logger/frontend/**"
      - "temperature-logger/src/static/**"
      - ".github/workflows/temperature-frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: temperature-logger/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check ../src/static/monitor.js
          node --check ../src/static/comfort.mjs
      - name: Build and unit tests
        run: npm run check
      - name: Confirm output files
        run: |
          test -f dist/index.html
          test -f dist/stats.html
          test -f dist/static/app.css
          test -f dist/static/monitor.js
          test -f dist/static/comfort.mjs
